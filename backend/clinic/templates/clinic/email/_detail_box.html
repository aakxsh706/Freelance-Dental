{% comment %}A labelled date/time block, reused by every appointment email.{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;background:#f3f1ec;border-radius:8px;margin:16px 0;">
  <tr><td style="padding:14px 18px;">
    <p style="margin:0 0 2px;font:600 11px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8b9294;">{{ box_label|default:"Appointment" }}</p>
    <p style="margin:0;font:600 16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#22282a;">{{ box_date }}</p>
    <p style="margin:0;font:400 15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#22282a;">{{ box_time }}</p>
  </td></tr>
</table>
